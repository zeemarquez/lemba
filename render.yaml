# Render Blueprint — deploy the PDF API from this monorepo.
# https://render.com/docs/blueprint-spec
#
# After connecting the repo in Render, choose "Apply render.yaml" (or add
# the Blueprint from the dashboard). Adjust `name`, `region`, or `plan`
# if needed.

services:
  - type: web
    name: modern-markdown-editor-api
    runtime: node
    rootDir: api-service
    # TypeScript is a devDependency; include dev packages for `tsc` only at build time.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MAX_UPLOAD_SIZE_MB
        value: "25"
      # Set in the Render dashboard when you apply the blueprint (sync: false).
      - key: API_KEY
        sync: false
